name: Build & Push Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to build
        default: main
        type: string

concurrency:
  group: build-images-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # On workflow_dispatch github.sha is the dispatching branch's head, not the
      # ref actually checked out — resolve it so sha- tags never mislabel a build.
      - name: Resolve built sha
        id: build
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gnoredeem-web
          tags: |
            type=raw,value=sha-${{ steps.build.outputs.sha }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3

      # VITE_* are inlined into the bundle at build time, so they must be
      # supplied here rather than as runtime container env.
      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GNOSIS_RPC=${{ secrets.VITE_GNOSIS_RPC }}
            VITE_DRPC_API_KEY=${{ secrets.VITE_DRPC_API_KEY }}
            VITE_WALLETCONNECT_PROJECT_ID=${{ secrets.VITE_WALLETCONNECT_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
